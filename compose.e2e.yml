# A copy of the Dropbox app for end-to-end tests, with its own database.
name: dropbox-e2e

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:3000"
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: e2e-password
      DB_NAME: app_e2e
      APP_SECRET: e2e-test-secret
      API_URL: http://localhost:8001
      CORS_ORIGIN: http://localhost:5174
      MAX_UPLOAD_MB: 5
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    command: sh -c "npm run db:seed && exec npm start"
    init: true
    tmpfs:
      - /app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: e2e-password
      MYSQL_DATABASE: app_e2e
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pe2e-password"]
      interval: 5s
      timeout: 5s
      retries: 10
